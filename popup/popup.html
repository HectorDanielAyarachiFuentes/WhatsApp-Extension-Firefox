<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>WhatsApp - Mensajes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="popup-container">

    <!-- Header estilo WhatsApp -->
    <div id="header">
      <div id="header-logo">
        <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <circle cx="16" cy="16" r="16" fill="#25D366"/>
          <path d="M16 5C9.925 5 5 9.925 5 16c0 2.09.577 4.044 1.582 5.71L5 27l5.448-1.558A10.94 10.94 0 0016 27c6.075 0 11-4.925 11-11S22.075 5 16 5z" fill="white"/>
          <path d="M11.5 12.5c.2-.5.7-1.5 1.5-1.5.3 0 .6.1.8.3l1.2 1.4c.3.4.2.9-.1 1.2l-.6.6c.3.7.8 1.4 1.4 2s1.3 1.1 2 1.4l.6-.6c.3-.3.8-.4 1.2-.1l1.4 1.2c.2.2.3.5.3.8 0 .8-1 1.3-1.5 1.5-2 .7-6-2-7.5-5.5-.3-.8-.4-1.8-.7-2.8z" fill="#25D366"/>
        </svg>
      </div>
      <div id="header-info">
        <span id="header-title">WhatsApp</span>
        <span id="header-subtitle">Mensajes sin leer</span>
      </div>
      <span id="header-count"></span>
    </div>

    <!-- Tabs de contactos -->
    <div id="tabs-container"></div>

    <!-- Área de preview -->
    <div id="preview-container">
      <div id="preview-empty">
        <div id="empty-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
            <path d="M20 6L9 17l-5-5" stroke="#25D366" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <p>Todo al día</p>
        <span>No tienes mensajes sin leer</span>
      </div>
    </div>

    <!-- Botón principal -->
    <button id="open-whatsapp">
      <svg width="17" height="17" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <path d="M16 2C8.268 2 2 8.268 2 16c0 2.526.666 4.896 1.832 6.94L2 30l7.244-1.894A13.94 13.94 0 0016 30c7.732 0 14-6.268 14-14S23.732 2 16 2z" fill="currentColor"/>
      </svg>
      <span>Abrir WhatsApp</span>
    </button>

  </div>
  <script src="popup.js"></script>
</body>
</html>

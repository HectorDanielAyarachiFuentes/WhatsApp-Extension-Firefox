<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>WhatsApp - Mensajes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="popup-container">

    <!-- Header -->
    <div id="header">
      <div id="header-logo">
        <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="28" height="28" rx="7" fill="#10B981"/>
          <rect x="5" y="7" width="2" height="18" rx="1" fill="#FFFFFF" fill-opacity="0.45"/>
          <path d="M11 8h13a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4h-7l-4 3v-3a4 4 0 0 1-2-3.5V11a3 3 0 0 1 3-3z" fill="#FFFFFF"/>
          <circle cx="15" cy="15" r="1.5" fill="#059669"/>
          <circle cx="19" cy="15" r="1.5" fill="#059669"/>
          <circle cx="23" cy="15" r="1.5" fill="#059669"/>
        </svg>
      </div>
      <div id="header-info">
        <span id="header-title">WhatsApp</span>
        <span id="header-subtitle">Mensajes sin leer</span>
      </div>
      <span id="header-count"></span>
    </div>

    <!-- Tabs de contactos -->
    <div id="tabs-container"></div>

    <!-- Área de preview -->
    <div id="preview-container">
      <div id="preview-empty">
        <div id="empty-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
            <path d="M20 6L9 17l-5-5" stroke="#25D366" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <p>Todo al día</p>
        <span>No tienes mensajes sin leer</span>
      </div>
    </div>

    <!-- Botón principal -->
    <button id="open-whatsapp">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
      <span>Abrir WhatsApp</span>
    </button>

  </div>
  <script src="popup.js"></script>
</body>
</html>

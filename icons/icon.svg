<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0FDF4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.25" flood-color="#022c22"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bgGrad)"/>

  <!-- Left Sidebar Dock Indicator -->
  <rect x="20" y="26" width="7" height="76" rx="3.5" fill="#FFFFFF" fill-opacity="0.4"/>

  <!-- Chat Bubble -->
  <g filter="url(#shadow)">
    <path d="M 44 30 H 96 A 16 16 0 0 1 112 46 V 70 A 16 16 0 0 1 96 86 H 64 L 46 98 V 86 A 16 16 0 0 1 36 70 V 38 A 8 8 0 0 1 44 30 Z" fill="url(#bubbleGrad)"/>
  </g>

  <!-- 3 Message Dots -->
  <circle cx="56" cy="58" r="5.5" fill="#059669"/>
  <circle cx="74" cy="58" r="5.5" fill="#059669"/>
  <circle cx="92" cy="58" r="5.5" fill="#059669"/>
</svg>
